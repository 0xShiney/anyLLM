services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      DATABASE_PATH: /data/anyllm.db
      LOG_ENCRYPTION_KEY: ${LOG_ENCRYPTION_KEY:?set LOG_ENCRYPTION_KEY di .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - anyllm-data:/data

volumes:
  anyllm-data:

